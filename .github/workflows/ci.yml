name: BFlow Studio CI

on:
  pull_request:
    branches:
      - "main"
      - "develop"

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: bflow
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Run code quality
        run: mvn -B checkstyle:check

      - name: Run tests with coverage JaCoCo - 25% required
        env:
          TEST_DB_HOST: localhost
        run: mvn -B clean verify